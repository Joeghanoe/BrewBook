# Local stand-in for oauth2-proxy (docker-compose `edge`). Not for deployment.
server {
    listen 80;
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header X-Forwarded-Email dev@brewbook.local;
        proxy_set_header X-Forwarded-User dev;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://web:8080/;
        proxy_set_header Host $host;
    }
}
