# Local stack without Google: api + web + postgres. The vite dev server (or the `edge` nginx
# below) fakes the identity header oauth2-proxy would set. See README.md → Run locally.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brewbook
      POSTGRES_PASSWORD: brewbook
      POSTGRES_DB: brewbook
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewbook"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://brewbook:brewbook@postgres:5432/brewbook
      Database__MigrateOnStartup: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GoogleMaps__RegionCode: ${GoogleMaps__RegionCode:-}
      Features__Friends: ${Features__Friends:-false}
      CLOUDFLARE_EMAIL_TOKEN: ${CLOUDFLARE_EMAIL_TOKEN:-}
      Email__AccountId: ${Email__AccountId:-}
      Email__From: ${Email__From:-}
      Email__PublicUrl: ${Email__PublicUrl:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: infra/web.Dockerfile }
    environment:
      PORT: "8080"

  # Stands in for oauth2-proxy: routes /api to the api, the rest to web, and stamps a fixed
  # identity. Never deploy this; it is the thing oauth2-proxy exists to replace.
  edge:
    image: nginx:1.27-alpine
    ports: ["3000:80"]
    volumes:
      - ./infra/local-edge.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, web]

volumes:
  pgdata:
