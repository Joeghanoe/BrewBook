name: Golden Path Review
on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: read
  discussions: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  review:
    if: github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/golden-path-review')
    uses: Joeghanoe/Guiderail/.github/workflows/golden-path-review.yml@main
    secrets: inherit
